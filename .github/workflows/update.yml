name: Update AniList calendars

on:
  schedule:
    # Every 6 hours. Adjust as you like (cron is UTC).
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write config.json from secret
        env:
          ANILIST_ACCOUNTS_JSON: ${{ secrets.ANILIST_ACCOUNTS_JSON }}
        run: |
          if [ -z "$ANILIST_ACCOUNTS_JSON" ]; then
            echo "ERROR: ANILIST_ACCOUNTS_JSON secret is not set. See README.md." >&2
            exit 1
          fi
          printf '%s' "$ANILIST_ACCOUNTS_JSON" > config.json

      - name: Generate calendars
        env:
          FILENAME_SALT: ${{ secrets.FILENAME_SALT }}
        run: python generate_calendar.py

      - name: Remove config.json before committing
        run: rm -f config.json

      - name: Commit and push updated calendars
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update AniList calendars [skip ci]"
            git push
          fi
